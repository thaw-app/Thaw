		170AD05A2BB9B60500A7AC63 /* Stamp Git SHA */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			inputPaths = (
				"$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)",
			);
			name = "Stamp Git SHA";
			shellPath = /bin/sh;
			shellScript = (
				"set -eu",
				"",
				"if SHA=$(git -C \"${SRCROOT}\" rev-parse --short HEAD 2>/dev/null); then",
				"    if ! git -C \"${SRCROOT}\" diff --quiet 2>/dev/null \\",
				"       || ! git -C \"${SRCROOT}\" diff --cached --quiet 2>/dev/null; then",
				"        SHA=\"${SHA}-dirty\"",
				"    fi",
				"else",
				"    SHA=\"unknown\"",
				"fi",
				"",
				"PLIST=\"${TARGET_BUILD_DIR}/${INFOPLIST_PATH}\"",
				"if [ ! -f \"$PLIST\" ]; then",
				"    echo \"warning: stamp-git-sha: plist not found at $PLIST\"",
				"    exit 0",
				"fi",
				"",
				"/usr/libexec/PlistBuddy -c \"Set :GitCommitSHA ${SHA}\" \"$PLIST\" 2>/dev/null \\",
				"    || /usr/libexec/PlistBuddy -c \"Add :GitCommitSHA string ${SHA}\" \"$PLIST\"",
				"",
				"echo \"stamp-git-sha: stamped ${SHA} into ${PLIST}\"",
				"",
			);
		};
