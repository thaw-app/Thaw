sonar.tests = ThawTests

sonar.exclusions = \
  **/*.png,**/*.xcassets/**,**/*.xcstrings,**/*.imageset/**,**/*.icon/**

# Coverage exclusions.
#
# Rule: a file is excluded only when its substance cannot run in a unit test --
# WindowServer/CGS/SkyLight private APIs, Accessibility permissions, Carbon
# hotkey registration, live display/space/running-app state, NSWindow/NSPanel/
# NSView subclasses, SwiftUI View bodies, XPC wiring, or @main entry points.
#
# Pure value types, algorithms, Codable models and parsing stay measured, even
# when they live under a UI-sounding path. Do not reintroduce blanket suffix
# globs (**/*Manager.swift, **/*Settings.swift) or blanket directory globs for
# Items/, ControlItem/, Input/Hotkeys/ and Utilities/ -- each of those buried
# algorithm code that already has dedicated suites in ThawTests.
#
# Paths are relative to the project base dir.

# MenuBarItemManager.swift and its MenuBarItemManager+*.swift extensions in
# Items/Manager/ (formerly the MenuBarItemManager/ folder) are excluded as a
# whole, which is the one exception to the rule above. Its substance is
# CGEvent synthesis, AX interaction and live WindowServer state -- none of
# which runs in a unit test. The algorithm code it used to bury has already
# been extracted into LayoutSolver, PendingLedger, AXIdentityCatalog and
# ClickReactionVerifier, all of which stay measured and carry dedicated suites
# in ThawTests. New decision logic belongs in those files, not back in the
# manager.
#
# Sonar globs cannot subtract, so the extensions are listed one by one:
# MenuBarItemManager+ExternalActivation.swift stays measured, and the other
# files in Items/Manager/ are not part of this exception.

# ProfileManager.swift and DisplaySettingsManager.swift were split the same
# way: the measured files keep the manifest/file CRUD, capture, persistence,
# lookup, URI handling and every decision rule, while the +Live companions
# hold the halves that need a running AppState — pushing snapshots into live
# managers, the spacing relaunch wave, NSScreen/WindowServer display state,
# Carbon hotkey registration, Focus Filter intents, and an app-modal alert.
# Capture now takes the three stores it actually reads (settings, appearance
# manager, item manager) instead of the full AppState, so save/update paths
# stay measured; the AppState overloads forwarding to them live in the
# excluded companions. New decision logic belongs in the measured files.

# MenuBarSection.swift and MenuBarItem.swift were split the same way rather
# than excluded whole, because both buried pure logic that the rule above says
# must stay measured.
#
#   MenuBarSectionLayout.swift keeps the section names, the presentation modes,
#   the notch gap and the three rules that decide how a section is shown.
#   MenuBarSection.swift keeps the instance half -- show, hide, toggle,
#   updateControlItemState, the rehide task and the mouse-moved monitor -- which
#   needs a live ControlItem/NSStatusItem, an AppState and a real NSScreen.
#
#   MenuBarItem.swift keeps the value type: capability flags, auto-detected
#   naming, identity, Equatable and Hashable. MenuBarItem+Enumeration.swift
#   takes the window enumeration, which reaches the window server through
#   Bridging/CGS and resolves owning processes over XPC. The unchecked
#   initializers and the MenuBarItemTag/Namespace helpers moved with it rather
#   than being widened to internal -- they are reachable only from that path.
#
# New decision logic on either type belongs in the measured file.
#
# The SettingsPanes/ subdirectories (General/, Layout/, Advanced/) hold the
# same substance as the top-level panes -- SwiftUI view bodies for rows,
# pickers and sections -- and join the exclusion for the same reason. They
# arrived with 2.1.0; if a pane ever grows decision logic worth measuring,
# extract it the way MenuBarSectionLayout.swift was extracted, and keep the
# view excluded.

# MenuBarItemTriggersManager.swift was split the ProfileManager way. The
# measured file keeps the decisions: the priority plan that resolves which
# trigger owns which item, identifier resolution across re-instanced items,
# feature availability, runtime status, ownership, CRUD, reordering and
# persistence. MenuBarItemTriggersManager+Live.swift takes setup and its
# observations, the evaluation pass that reads the live item cache, the
# debounced apply, the serial move chain and its retry bookkeeping, reveal
# notifications, script runs and menu bar image capture.
#
# Members the live half needs are internal rather than private, the same
# concession ProfileManager makes. New decision logic belongs in the measured
# file.

# The 2.1.0 trigger and hotkey sources were split along the same seam, for the
# same reason: each one paired a plain value type with a live-system owner, and
# the owner's bulk was drowning the value type's measurement.
#
#   SystemState.swift keeps ScriptOutcome and the SystemState snapshot every
#   trigger condition is evaluated against. SystemStateMonitor.swift takes the
#   aggregation: CoreWLAN, CoreAudio, IOBluetooth, CoreMediaIO, NWPathMonitor,
#   CoreLocation, Intents and NSWorkspace observers, none of which produces a
#   deterministic reading on a CI runner.
#
#   PowerState.swift keeps the snapshot and the IOPS source-list reduction --
#   pure dictionary handling, and the part that actually decides whether a
#   battery condition matches. PowerSourceMonitor.swift takes the IOKit
#   run-loop source and the safety timer.
#
#   EnergyMode.swift keeps the mode and its display strings.
#   EnergyModeMonitor.swift takes the SCDynamicStore registration.
#
#   MenuBarSpacer.swift keeps the value type: the width clamp and the decoder
#   that applies it to persisted widths. MenuBarSpacerManager.swift takes the
#   NSStatusBar item lifecycle, the autosave-name defaults and the button
#   window title assertion.
#
#   HotkeyAction.swift keeps the case list, its persisted raw values and
#   settingsActions. HotkeyAction+Perform.swift takes the dispatch, whose every
#   branch drives a live menu bar, search panel or user notification.
#
# PresentationMonitor.swift is excluded whole rather than split: it is nothing
# but signals -- CGDisplayIsInMirrorSet over NSScreen.screens, and a
# sysctl(KERN_PROC_ALL) walk of the process table -- with no value type to
# separate out.
#
# New decision logic belongs in the measured half of each pair.

