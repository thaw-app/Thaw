sonar.projectKey = stonerl_Thaw
sonar.organization = stonerl

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName = Thaw
sonar.projectVersion = 1.3.0

sonar.sources = Thaw,Shared,MenuBarItemService
sonar.tests = ThawTests

sonar.exclusions = \
  **/*.png,**/*.pdf,**/*.xcassets/**,**/*.xcstrings,**/*.imageset/**,**/*.icon/**

# Coverage exclusions are for code that genuinely cannot be tested. Each
# group below is justified by the comment above it. Prefer excluding a
# specific file over a blanket filename-suffix wildcard pattern -- a
# wildcard pattern encodes a naming convention, not a claim about
# testability, and silently captures every future file that happens to
# match it (this is exactly what previously excluded every manager,
# event-tap, and menu-bar-item file from coverage).
#
# NOTE: Java Properties line-continuation (trailing "\") does not allow
# "#" comment lines to be interspersed inside a continued value -- a
# continuation line is appended to the value literally, comment marker
# and all, which would corrupt this list. So the per-group justifications
# are grouped here, in the order the corresponding entries appear below.
#
# 1. App entry points -- process/app bootstrap with no branching logic:
#    AppDelegate.swift, Main/IceApp.swift, MenuBarItemService/main.swift
# 2. Top-level app state / dependency wiring -- constructs and wires the
#    full manager graph; exercised through the running app, not isolated
#    unit tests: AppState.swift, AppNavigationState.swift
# 3. Live Accessibility (AX) / XPC wrappers -- require a live menu bar
#    item window or a running XPC connection, not unit-testable in
#    isolation: MenuBarItemService/SourcePIDCache.swift,
#    MenuBarItemService/Listener.swift, Shared/Utilities/AXHelpers.swift
# 4. Objective-C interop shims for private SPI declarations -- no logic
#    of their own: Bridging/Shims.swift
# 5. Wraps ScreenCaptureKit / CGWindow APIs -- requires a live display
#    and Screen Recording permission: ScreenCapture.swift
# 6. MainActor ObservableObject settings models with
#    @Published/UserDefaults side effects -- their decodable/business
#    logic is covered via separate Codable snapshot types (see
#    GeneralSettingsSnapshotTests) rather than direct unit tests on the
#    ObservableObject itself: *Settings.swift
# 7. Pure SwiftUI view/window/sheet/pane files with no independent logic
#    -- verified visually, not unit tested (project policy):
#    *SettingsPane.swift, *SettingsView.swift, *SettingsWindow.swift,
#    *View.swift, *Window.swift, *Sheet.swift, MenuBarAppearanceEditor.swift,
#    MenuBarShapePicker.swift, SectionedList.swift,
#    LayoutBarNewItemsBadgeView.swift, NotchIndicatorOverlay.swift,
#    MenuBarItemContainer.swift, LayoutBar/LayoutBarContainer.swift,
#    UI/IceUI/*.swift, UI/Modifiers/*.swift, UI/Shapes/*.swift,
#    UI/Utilities/*.swift, UI/Views/BetaBadge.swift, UI/Views/CalloutBox.swift,
#    UI/Views/CustomTooltip.swift
# 8. SwiftUI wrapper capturing live keyboard input via NSEvent monitors --
#    requires interactive input, not unit-testable: HotkeyRecorder.swift
# 9. Hotkey primitives -- HotkeyRegistry/Hotkey wrap live Carbon/HIToolbox
#    event registration; kept as one file list rather than splitting the
#    directory's pure value types out: Hotkeys/*.swift
# 10. NSStatusItem-backed control item wrapper -- requires a live menu
#     bar status item, not unit-testable in isolation: ControlItem/*.swift
# 11. Wraps live macOS permission state (Accessibility / Screen Recording
#     via TCC); requires system permission APIs:
#     Permissions/AppPermissions.swift, Permissions/Permission.swift
# 12. App Intents (Shortcuts) integration -- requires live App Intents
#     framework registration: Settings/Models/FocusFilterIntent.swift
# 13. Mutates live UserDefaults / app state as a side effect --
#     integration-level, not a unit: Settings/Models/SettingsResetter.swift
# 14. MainActor ObservableObject search state -- exercised through the
#     live search UI, not isolated unit tests: Search/MenuBarSearchModel.swift
# 15. Navigation identifier constants with no independent logic:
#     Main/Navigation/NavigationIdentifiers/*.swift
# 16. Sparkle update-check wiring -- requires a live update feed /
#     network call, not unit-testable in isolation: Main/Updates.swift
sonar.coverage.exclusions = \
  **/AppDelegate.swift,\
  **/Main/IceApp.swift,\
  **/MenuBarItemService/main.swift,\
  **/AppState.swift,\
  **/AppNavigationState.swift,\
  **/MenuBarItemService/SourcePIDCache.swift,\
  **/MenuBarItemService/Listener.swift,\
  **/Shared/Utilities/AXHelpers.swift,\
  **/Bridging/Shims.swift,\
  **/ScreenCapture.swift,\
  **/*Settings.swift,\
  **/*SettingsPane.swift,\
  **/*SettingsView.swift,\
  **/*SettingsWindow.swift,\
  **/*View.swift,\
  **/*Window.swift,\
  **/*Sheet.swift,\
  **/MenuBarAppearanceEditor.swift,\
  **/MenuBarShapePicker.swift,\
  **/SectionedList.swift,\
  **/LayoutBarNewItemsBadgeView.swift,\
  **/NotchIndicatorOverlay.swift,\
  **/MenuBarItemContainer.swift,\
  **/LayoutBar/LayoutBarContainer.swift,\
  **/UI/IceUI/*.swift,\
  **/UI/Modifiers/*.swift,\
  **/UI/Shapes/*.swift,\
  **/UI/Utilities/*.swift,\
  **/UI/Views/BetaBadge.swift,\
  **/UI/Views/CalloutBox.swift,\
  **/UI/Views/CustomTooltip.swift,\
  **/HotkeyRecorder.swift,\
  **/Hotkeys/*.swift,\
  **/ControlItem/*.swift,\
  **/Permissions/AppPermissions.swift,\
  **/Permissions/Permission.swift,\
  **/Settings/Models/FocusFilterIntent.swift,\
  **/Settings/Models/SettingsResetter.swift,\
  **/Search/MenuBarSearchModel.swift,\
  **/Main/Navigation/NavigationIdentifiers/*.swift,\
  **/Main/Updates.swift

# Coverage report in SonarQube generic format (generated by xcresultparser)
sonar.coverageReportPaths = coverage.xml

sonar.sourceEncoding = UTF-8
