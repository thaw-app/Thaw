# Issue suppressions.
#
# swift:S1075 (URIs should not be hardcoded) fires on the absolute system
# paths a macOS app must shell out to (/bin/sh, /usr/bin/killall,
# /usr/bin/tccutil, launchd state keys) and on stable external service URLs
# such as the Crowdin project. None of these are deployment-configurable
# values an app bundle could discover at runtime, so the rule is disabled
# project-wide instead of scattering NOSONAR comments through launch helpers.
sonar.issue.ignore.multicriteria=s1075,s107a,s107b
sonar.issue.ignore.multicriteria.s1075.ruleKey=swift:S1075
sonar.issue.ignore.multicriteria.s1075.resourceKey=**/*.swift
#
# swift:S107 (too many parameters) on the two value snapshots:
#   - SystemState's initializer mirrors the published snapshot one-to-one,
#     every field defaulted and keyword-labeled, and doubles as the test
#     fixture factory. Grouping the fields into nested structs would turn
#     every condition evaluation and fixture into property chains for no
#     behavioral gain.
#   - MenuBarItemTrigger's initializer mirrors its Codable fields the same
#     way.
# The rule stays active everywhere else; move() and moveItem() were
# refactored onto MoveOptions rather than suppressed.
sonar.issue.ignore.multicriteria.s107a.ruleKey=swift:S107
sonar.issue.ignore.multicriteria.s107a.resourceKey=**/SystemState.swift
sonar.issue.ignore.multicriteria.s107b.ruleKey=swift:S107
sonar.issue.ignore.multicriteria.s107b.resourceKey=**/MenuBarItemTrigger.swift

