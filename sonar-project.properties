sonar.projectKey=thaw-app_Thaw
sonar.organization=thaw-app

# This is name and version displayed in the SonarQube Cloud UI.
# Keep in sync with MARKETING_VERSION in Thaw.xcodeproj.
sonar.projectName = Thaw
sonar.projectVersion = 2.0.0-rc.3

sonar.sources = Thaw,Shared,MenuBarItemService
sonar.tests = ThawTests

sonar.exclusions = \
  **/*.png,**/*.pdf,**/*.xcassets/**,**/*.xcstrings,**/*.imageset/**,**/*.icon/**

# Coverage exclusions.
#
# Rule: a file is excluded only when its substance cannot run in a unit test --
# WindowServer/CGS/SkyLight private APIs, Accessibility permissions, Carbon
# hotkey registration, live display/space/running-app state, NSWindow/NSPanel/
# NSView subclasses, SwiftUI View bodies, XPC wiring, or @main entry points.
#
# Pure value types, algorithms, Codable models and parsing stay measured, even
# when they live under a UI-sounding path. Do not reintroduce blanket suffix
# globs (**/*Manager.swift, **/*Settings.swift) or blanket directory globs for
# MenuBarItems/, ControlItem/, Hotkeys/ and Utilities/ -- each of those buried
# algorithm code that already has dedicated suites in ThawTests.
#
# Paths are relative to the project base dir.

# The MenuBarItemManager/ folder (formerly the single
# MenuBarItemManager.swift) is excluded as a whole, which is the one
# exception to the rule above. Its substance is CGEvent synthesis, AX
# interaction and live WindowServer state -- none of which runs in a unit
# test. The algorithm code it used to bury has already been extracted into
# LayoutSolver, PendingLedger, AXIdentityCatalog and ClickReactionVerifier,
# all of which stay measured and carry dedicated suites in ThawTests. New
# decision logic belongs in those files, not back in the manager.

# ProfileManager.swift and DisplaySettingsManager.swift were split the same
# way: the measured files keep the manifest/file CRUD, capture, persistence,
# lookup, URI handling and every decision rule, while the +Live companions
# hold the halves that need a running AppState — pushing snapshots into live
# managers, the spacing relaunch wave, NSScreen/WindowServer display state,
# Carbon hotkey registration, Focus Filter intents, and an app-modal alert.
# Capture now takes the three stores it actually reads (settings, appearance
# manager, item manager) instead of the full AppState, so save/update paths
# stay measured; the AppState overloads forwarding to them live in the
# excluded companions. New decision logic belongs in the measured files.

# MenuBarSection.swift and MenuBarItem.swift were split the same way rather
# than excluded whole, because both buried pure logic that the rule above says
# must stay measured.
#
#   MenuBarSectionLayout.swift keeps the section names, the presentation modes,
#   the notch gap and the three rules that decide how a section is shown.
#   MenuBarSection.swift keeps the instance half -- show, hide, toggle,
#   updateControlItemState, the rehide task and the mouse-moved monitor -- which
#   needs a live ControlItem/NSStatusItem, an AppState and a real NSScreen.
#
#   MenuBarItem.swift keeps the value type: capability flags, auto-detected
#   naming, identity, Equatable and Hashable. MenuBarItem+Enumeration.swift
#   takes the window enumeration, which reaches the window server through
#   Bridging/CGS and resolves owning processes over XPC. The unchecked
#   initializers and the MenuBarItemTag/Namespace helpers moved with it rather
#   than being widened to internal -- they are reachable only from that path.
#
# New decision logic on either type belongs in the measured file.

