name: Promote (Thaw 2)

# Ships a release candidate as the stable release without rebuilding it. The
# candidate must have been built with its final version (MARKETING_VERSION
# 2.1.0, tagged 2.1.0-rc.1), so the same signed, notarized bytes become 2.1.0.
#
# Sparkle offers an item with no sparkle:channel to everyone, so promotion
# removes the candidate's channel in the feed. generate_appcast keeps an
# existing item's channel on later runs, so the promotion sticks.
#
# Every step checks for its own result first, so a failed run can be rerun
# with the same tag and picks up where it stopped.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release candidate to promote (for example, 2.1.0-rc.1)
        required: true
        type: string
      publish_appcast:
        description: Push the promoted appcast to thaw-app/updates gh-pages
        required: false
        type: boolean
        default: true
      dry_run:
        description: "Dry run: check and report only. Tags, releases and publishes nothing."
        required: false
        type: boolean
        default: false
      release_notes:
        description: >-
          Optional override for the stable release notes (Markdown). If blank,
          the CHANGELOG.md section for the stable version on the branch this
          runs from is used ("## [2.1.0]").
        required: false
        type: string
        default: ""

concurrency:
  # Shares the feed with release.yml; never edit it from two runs at once.
  group: sparkle-appcast${{ inputs.dry_run && '-dry-run' || '' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    if: github.repository == 'thaw-app/Thaw'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      UPDATES_REPOSITORY: thaw-app/updates
      LEGACY_APPCAST_REPOSITORY: stonerl/Thaw
    steps:
      # Notes and the appcast action come from the branch this runs from, so
      # the stable notes can be written after the candidate was tagged.
      - name: Checkout notes and actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            legacy/.github/actions
            legacy/CHANGELOG.md
          sparse-checkout-cone-mode: false

      - name: Resolve versions
        id: meta
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$TAG" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-(rc|beta)\.[0-9]+$ ]]; then
            echo "::error::Only rc and beta tags can be promoted, for example 2.1.0-rc.1"
            exit 1
          fi
          stable="${BASH_REMATCH[1]}"
          if [[ "$stable" != 2.* ]]; then
            echo "::error::Promote (Thaw 2) promotes 2.x candidates only, not ${TAG}"
            exit 1
          fi

          is_draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [[ "$is_draft" != "false" ]]; then
            echo "::error::Release ${TAG} must be published before it can be promoted"
            exit 1
          fi
          commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq .sha)"

          # A rerun finds the stable tag it made last time; anything else is a conflict.
          if stable_commit="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${stable}" --jq .sha 2>/dev/null)"; then
            if [[ "$stable_commit" != "$commit" ]]; then
              echo "::error::${stable} is already tagged at ${stable_commit}, not ${TAG}'s ${commit}"
              exit 1
            fi
            echo "::notice::${stable} already tags ${TAG}'s commit; resuming"
          fi

          {
            echo "tag=$TAG"
            echo "stable=$stable"
            echo "commit=$commit"
          } >> "$GITHUB_OUTPUT"
          echo "promote $TAG ($commit) to $stable"

      - name: Resolve release notes
        id: notes
        env:
          STABLE: ${{ steps.meta.outputs.stable }}
          RELEASE_NOTES_INPUT: ${{ inputs.release_notes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re

          stable = os.environ["STABLE"]
          notes = os.environ.get("RELEASE_NOTES_INPUT", "")
          if not notes.strip():
              text = open("legacy/CHANGELOG.md", encoding="utf-8").read()
              match = re.search(r"^##\s+\[?" + re.escape(stable) + r"\]?.*$", text, re.MULTILINE)
              if not match:
                  raise SystemExit(f"::error::Add a '## [{stable}]' section to legacy/CHANGELOG.md, or pass release_notes")
              rest = text[match.end():]
              next_heading = re.search(r"^##\s+", rest, re.MULTILINE)
              notes = (rest[: next_heading.start()] if next_heading else rest).strip()
          path = os.path.join(os.environ["RUNNER_TEMP"], "notes.md")
          with open(path, "w", encoding="utf-8") as f:
              f.write(notes + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"path={path}\n")
          PY
          jq -n --rawfile text "$RUNNER_TEMP/notes.md" '{text: $text, mode: "gfm"}' \
            | gh api --method POST /markdown --input - > "$RUNNER_TEMP/notes.html"
          echo "html=$RUNNER_TEMP/notes.html" >> "$GITHUB_OUTPUT"

      - name: Fetch the candidate and the feed
        id: inputs
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          GH_TOKEN: ${{ secrets.UPDATES_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/promote"
          mkdir -p "$dir"
          gh release download "$TAG" --repo "$UPDATES_REPOSITORY" \
            --pattern "Thaw_${TAG}.zip" --dir "$dir"
          # Raw, because the JSON form leaves content empty above 1 MB.
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/${UPDATES_REPOSITORY}/contents/appcast.xml?ref=gh-pages" \
            > "$dir/appcast-before.xml"
          [[ -s "$dir/appcast-before.xml" ]] || { echo "::error::The current appcast is empty"; exit 1; }
          {
            echo "zip=$dir/Thaw_${TAG}.zip"
            echo "appcast=$dir/appcast-before.xml"
          } >> "$GITHUB_OUTPUT"

      # Refuses a candidate built with its prerelease version: promoting it
      # would ship an app whose About says 2.1.0-rc.1.
      - name: Promote the feed item
        id: promote
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          STABLE: ${{ steps.meta.outputs.stable }}
          ZIP_PATH: ${{ steps.inputs.outputs.zip }}
          APPCAST_PATH: ${{ steps.inputs.outputs.appcast }}
          NOTES_HTML: ${{ steps.notes.outputs.html }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.meta.outputs.stable }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import plistlib
          import sys
          import zipfile
          from xml.dom import Node, minidom

          sys.path.insert(0, "legacy/.github/actions/prepare-appcasts")
          from prepare_appcasts import build_number, enclosure_tag, sparkle_elements, text, update_enclosures

          tag, stable = os.environ["TAG"], os.environ["STABLE"]

          with zipfile.ZipFile(os.environ["ZIP_PATH"]) as archive:
              plist = next(n for n in archive.namelist() if n.count("/") == 2 and n.endswith(".app/Contents/Info.plist"))
              info = plistlib.loads(archive.read(plist))
          short, build = info["CFBundleShortVersionString"], str(info["CFBundleVersion"])
          if short != stable:
              raise SystemExit(f"::error::{tag} was built as {short}, not {stable}; it can't be promoted without a rebuild")

          def replace(element, node):
              for child in list(element.childNodes):
                  element.removeChild(child)
              element.appendChild(node)

          with minidom.parse(os.environ["APPCAST_PATH"]) as document:
              # generate_appcast writes versions as item elements, never as
              # enclosure attributes, so an item without them is not ours.
              items = [i for i in document.getElementsByTagName("item") if build_number(i) == build]
              if len(items) != 1:
                  raise SystemExit(f"::error::Expected one feed item for build {build}, found {len(items)}")
              item = items[0]
              if enclosure_tag(item) != tag:
                  raise SystemExit(f"::error::Build {build}'s feed item downloads {enclosure_tag(item)}, not {tag}")
              versions = sparkle_elements(item, "shortVersionString")
              if len(versions) != 1:
                  raise SystemExit(f"::error::Build {build}'s feed item has no sparkle:shortVersionString element")

              channels = sparkle_elements(item, "channel")
              already = not channels and text(versions[0]) == stable
              if not channels and not already:
                  raise SystemExit(f"::error::Build {build} is stable as {text(versions[0])}, not {stable}")

              for channel in channels:
                  spacing = channel.previousSibling
                  item.removeChild(channel)
                  if spacing and spacing.nodeType == Node.TEXT_NODE and not spacing.data.strip():
                      item.removeChild(spacing)
              replace(versions[0], document.createTextNode(stable))

              html = open(os.environ["NOTES_HTML"], encoding="utf-8").read()
              descriptions = item.getElementsByTagName("description")
              if descriptions:
                  replace(descriptions[0], document.createCDATASection(html))
              else:
                  description = document.createElement("description")
                  description.appendChild(document.createCDATASection(html))
                  item.insertBefore(description, update_enclosures(item)[0])
              for link in item.getElementsByTagName("link"):
                  replace(link, document.createTextNode(os.environ["RELEASE_URL"]))

              path = os.path.join(os.environ["RUNNER_TEMP"], "promote", "appcast-promoted.xml")
              with open(path, "wb") as f:
                  f.write(document.toxml(encoding="utf-8"))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"appcast={path}\nbuild={build}\n")
          state = "already promoted; refreshed" if already else "promoted"
          print(f"{tag} (build {build}) {state} to {stable} in the feed")
          PY

      - name: Prepare appcasts
        id: appcasts
        uses: ./legacy/.github/actions/prepare-appcasts
        with:
          appcast-path: ${{ steps.promote.outputs.appcast }}
          release-tag: ${{ steps.meta.outputs.stable }}
          previous-appcast-path: ${{ steps.inputs.outputs.appcast }}

      # Under the stable tag too, so later stable releases find it as a delta base.
      - name: Create updates release
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          STABLE: ${{ steps.meta.outputs.stable }}
          ZIP_PATH: ${{ steps.inputs.outputs.zip }}
          GH_TOKEN: ${{ secrets.UPDATES_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          stable_zip="$RUNNER_TEMP/promote/Thaw_${STABLE}.zip"
          cp "$ZIP_PATH" "$stable_zip"
          if gh release view "$STABLE" --repo "$UPDATES_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::${STABLE} already exists on ${UPDATES_REPOSITORY}; completing it"
            "$GITHUB_WORKSPACE/legacy/.github/actions/prepare-appcasts/attach_release_assets.sh" \
              "$UPDATES_REPOSITORY" "$STABLE" "$stable_zip"
            gh release edit "$STABLE" --repo "$UPDATES_REPOSITORY" --draft=false >/dev/null
            exit 0
          fi
          gh release create "$STABLE" "$stable_zip" \
            --repo "$UPDATES_REPOSITORY" \
            --target main \
            --title "$STABLE" \
            --notes "Sparkle update payload for Thaw \`${STABLE}\`, promoted unchanged from \`${TAG}\`.

          Installer DMG: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${STABLE}"

      - name: Tag the candidate's commit
        if: ${{ !inputs.dry_run }}
        env:
          STABLE: ${{ steps.meta.outputs.stable }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Resolve versions already refused a tag at any other commit.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${STABLE}" >/dev/null 2>&1; then
            echo "::notice::${STABLE} is already tagged"
            exit 0
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${STABLE}" -f sha="$COMMIT" >/dev/null

      # The candidate's DMG, SBOM, signatures and provenance, byte for byte.
      # Sigstore bundles and attestations bind to digests, so they still verify.
      - name: Create Thaw release
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          STABLE: ${{ steps.meta.outputs.stable }}
          NOTES_PATH: ${{ steps.notes.outputs.path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/promote/assets"
          mkdir -p "$assets"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$assets"
          # Sparkle payloads stay on thaw-app/updates.
          rm -f "$assets"/*.zip "$assets"/*.delta
          if gh release view "$STABLE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::${STABLE} already exists; completing it"
            "$GITHUB_WORKSPACE/legacy/.github/actions/prepare-appcasts/attach_release_assets.sh" \
              "$GITHUB_REPOSITORY" "$STABLE" "$assets"/*
            gh release edit "$STABLE" --repo "$GITHUB_REPOSITORY" \
              --notes-file "$NOTES_PATH" --draft=false --latest >/dev/null
            exit 0
          fi
          gh release create "$STABLE" "$assets"/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$STABLE" \
            --notes-file "$NOTES_PATH" \
            --latest

      - name: Publish appcast to updates gh-pages
        if: ${{ inputs.publish_appcast && !inputs.dry_run }}
        uses: thaw-app/org-ci/actions/publish-file-to-branch@d90bbc87aa4dff91d3bc9e30fb6ceef0765bd986
        with:
          repository: ${{ env.UPDATES_REPOSITORY }}
          branch: gh-pages
          source-path: ${{ steps.appcasts.outputs.appcast-path }}
          destination-path: appcast.xml
          token: ${{ secrets.UPDATES_GITHUB_TOKEN }}
          commit-message: "chore(sparkle): promote ${{ steps.meta.outputs.tag }} to ${{ steps.meta.outputs.stable }}"
          gitignore-allowlist: |
            *
            !appcast.xml
            !.gitignore

      - name: Mirror 2.x appcast to legacy stonerl Pages
        if: ${{ inputs.publish_appcast && !inputs.dry_run && startsWith(steps.meta.outputs.stable, '2.') }}
        uses: thaw-app/org-ci/actions/publish-file-to-branch@d90bbc87aa4dff91d3bc9e30fb6ceef0765bd986
        with:
          repository: ${{ env.LEGACY_APPCAST_REPOSITORY }}
          branch: main
          source-path: ${{ steps.appcasts.outputs.legacy-appcast-path }}
          destination-path: appcast.xml
          token: ${{ secrets.LEGACY_APPCAST_TOKEN }}
          commit-message: "chore(sparkle): mirror appcast for ${{ steps.meta.outputs.stable }} (promoted from ${{ steps.meta.outputs.tag }})"
          max-attempts: "3"

      - name: Summary
        if: ${{ always() && steps.promote.outcome == 'success' }}
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          STABLE: ${{ steps.meta.outputs.stable }}
          BUILD: ${{ steps.promote.outputs.build }}
          BEFORE: ${{ steps.inputs.outputs.appcast }}
          AFTER: ${{ steps.appcasts.outputs.appcast-path }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          {
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "# Dry run: nothing was tagged, released or published"
            else
              echo "# Promoted \`${TAG}\` to \`${STABLE}\`"
            fi
            echo
            echo "Build ${BUILD}, unchanged. Feed diff:"
            echo
            echo '```diff'
            diff -u "$BEFORE" "$AFTER" | head -n 200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
