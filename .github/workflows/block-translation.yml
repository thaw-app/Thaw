name: "Block Translation (PRs)"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.xcstrings"

permissions:
  contents: read

jobs:
  block-manual-translations:
    if: github.repository == 'thaw-app/Thaw'
    runs-on: ubuntu-slim
    permissions:
      pull-requests: write
      issues: write
    steps:
      - uses: thaw-app/org-ci/actions/block-translation-prs@61f345397193bf3f9356c4f6179fb6ed4c84dd45
        with:
          product: Thaw
          crowdin-url: https://crowdin.com/project/thaw
          translation-sync-branch: l10n_development
