name: CI
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
# Runs on every PR and push to development so Scorecard sees checks; the
# macOS work stays gated on path detection below.
on:
  pull_request:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    if: github.repository == 'thaw-app/Thaw'
    runs-on: ubuntu-slim
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect code-related paths
        id: filter
        uses: thaw-app/org-ci/actions/detect-code-changes@cfa52194f39013d6f54e6f5a14dc57cec3a20e9b
        with:
          patterns: '(\.swift$|(^|/)Package\.swift$|(^|/)Package\.resolved$|^sonar-project\.properties$|^\.swiftlint|^\.swiftformat|^Thaw\.xcodeproj/|^scripts/|\.xcstrings$|^\.github/workflows/ci\.yml$)'

  static_analysis:
    needs: changes
    if: github.repository == 'thaw-app/Thaw'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
        with:
          fetch-depth: 0

      - name: Skip lint (no code changes)
        if: needs.changes.outputs.code != 'true'
        run: echo "No code-related paths changed; skipping SwiftLint."

      - name: Validate XCStrings
        if: needs.changes.outputs.code == 'true' && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD | grep '\.xcstrings$' || true)
          if [ -z "$changed_files" ]; then
            echo "No modified .xcstrings files."
            exit 0
          fi
          for file in $changed_files; do
            echo "Validating $file"
            python3 -m json.tool "$file" > /dev/null
          done

      - name: Verify SwiftLint input file list
        if: needs.changes.outputs.code == 'true'
        run: |
          set -euo pipefail
          chmod +x scripts/generate-swiftlint-inputs.sh
          scripts/generate-swiftlint-inputs.sh /tmp/swiftlint-inputs.xcfilelist
          diff -u scripts/swiftlint-inputs.xcfilelist /tmp/swiftlint-inputs.xcfilelist

      - name: Run SwiftLint
        if: needs.changes.outputs.code == 'true'
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            ghcr.io/realm/swiftlint:0.63.3@sha256:b70b763c949399cc3e4fdcfbc7588944d9503d498b6d96e853dfa07a944256e6 \
            swiftlint --strict

  build:
    if: github.repository == 'thaw-app/Thaw'
    runs-on: xcode-27
    needs: [changes, static_analysis]
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - name: Skip macOS build (no code changes)
        if: needs.changes.outputs.code != 'true'
        run: echo "No code-related paths changed; skipping xcodebuild test."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'
      - name: Cache SwiftPM
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Build/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Compute cache week
        if: needs.changes.outputs.code == 'true'
        id: cache-week
        run: echo "week=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"

      # Persists Xcode's compilation cache so most of the build is cache hits. Keyed
      # by week to rotate it; restore-keys start from last week's.
      - name: Cache Swift compilation cache
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Build/CompilationCache.noindex
          key: compilation-cache-${{ runner.os }}-${{ github.ref_name }}-${{ steps.cache-week.outputs.week }}
          restore-keys: |
            compilation-cache-${{ runner.os }}-${{ github.ref_name }}-
            compilation-cache-${{ runner.os }}-

      - name: Build and Test
        if: needs.changes.outputs.code == 'true'
        run: |
          xcodebuild test \
            -project Thaw.xcodeproj \
            -scheme Thaw \
            -derivedDataPath Build/ \
            -destination 'platform=macOS' \
            -enableCodeCoverage YES \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Convert coverage to XML
        if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          XCRESULTPARSER_VERSION: "2.0.1"
        run: |
          set -euo pipefail
          curl -fsSL -o xcresultparser.zip \
            "https://github.com/a7ex/xcresultparser/releases/download/${XCRESULTPARSER_VERSION}/xcresultparser.zip"
          unzip -oq xcresultparser.zip
          NEWEST_BUNDLE=$(ls -td Build/Logs/Test/*.xcresult 2>/dev/null | head -n1)
          ./product/xcresultparser -c -o xml "$NEWEST_BUNDLE" > coverage.xml
          # Sonar matches coverage by path on Linux, so rewrite this runner's absolute
          # paths; the script fails if nothing resolves rather than report 0%.
          python3 scripts/normalize-coverage.py coverage.xml

      - name: Upload Coverage XML
        if: needs.changes.outputs.code == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-data
          path: coverage.xml
          retention-days: 1
          if-no-files-found: error

  # Tests with Xcode 26.6 on macOS 26; `build` covers Xcode 27 on macOS 27
  # and owns coverage. Not on a push: the pull request already ran it on the
  # same code, and only `build` is needed again, for Sonar's coverage.
  build-macos-26:
    if: github.repository == 'thaw-app/Thaw' && github.event_name != 'push'
    runs-on: macos-26
    needs: [changes, static_analysis]
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - name: Skip macOS build (no code changes)
        if: needs.changes.outputs.code != 'true'
        run: echo "No code-related paths changed; skipping xcodebuild test."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code == 'true'

      - name: Select Xcode 26.6
        if: needs.changes.outputs.code == 'true'
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Cache SwiftPM
        if: needs.changes.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Build/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: spm-macos-26-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-macos-26-

      - name: Build and Test
        if: needs.changes.outputs.code == 'true'
        run: |
          xcodebuild test \
            -project Thaw.xcodeproj \
            -scheme Thaw \
            -derivedDataPath Build/ \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

  # Always runs so Scorecard sees a Sonar check on nearly every PR; forks and
  # Dependabot no-op without secrets under the same job name.
  sonarqube:
    needs: [changes, build]
    if: github.repository == 'thaw-app/Thaw'
    runs-on: ubuntu-latest
    env:
      # Forks and Dependabot get no SONAR_TOKEN on pull_request.
      SONAR_ENABLED: ${{ github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Skip SonarQube for fork / Dependabot PRs
        if: env.SONAR_ENABLED != 'true'
        run: |
          echo "Skipping SonarQube analysis (fork or Dependabot PR; no SONAR_TOKEN access)"
          echo "Analysis will be performed after merge to the default branch"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SONAR_ENABLED == 'true'
        with:
          fetch-depth: 0
          persist-credentials: false

      # Uses this run's coverage, or the last cached report when the build was
      # skipped. With neither, it leaves the last analysis alone.
      - name: Scan with coverage
        if: env.SONAR_ENABLED == 'true'
        uses: thaw-app/org-ci/actions/sonar-scan@cfa52194f39013d6f54e6f5a14dc57cec3a20e9b
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
          code-changed: ${{ needs.changes.outputs.code }}
          cache-path: coverage.xml
          reports: |
            sonar.coverageReportPaths=coverage.xml
