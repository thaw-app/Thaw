name: PR Command Trigger

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  trigger-build:
    if: ${{ github.repository == 'thaw-app/Thaw' && github.event.issue.pull_request && startsWith(github.event.comment.body, '.build') }}
    runs-on: ubuntu-slim
    permissions:
      actions: write
      issues: write
      pull-requests: write

    steps:
      - uses: thaw-app/org-ci/actions/pr-build-command@a5d047fe853b328067a3423f40d404b4b8245653
