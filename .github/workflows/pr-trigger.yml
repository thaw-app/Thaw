name: PR Command Trigger

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  trigger-build:
    if: ${{ github.repository == 'thaw-app/Thaw' && github.event.issue.pull_request && startsWith(github.event.comment.body, '.build') }}
    runs-on: ubuntu-slim
    permissions:
      actions: write
      issues: write
      pull-requests: write

    steps:
      - uses: thaw-app/org-ci/actions/pr-build-command@214298d1d187792fa31e638bf27b146f0de5565e
