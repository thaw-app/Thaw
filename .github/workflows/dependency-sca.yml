# Software composition analysis gate for OpenSSF Baseline OSPS-VM-05.03.
# Scans Swift Package.resolved (and other lockfiles we pass) against OSV and
# fails when known vulnerabilities remain unsuppressed.
#
# Uses a version+SHA256–pinned osv-scanner binary (same trust pattern as Syft
# in release.yml). The google/osv-scanner-action image is still on v2.3.8, which
# cannot extract Package.resolved; CLI v2.4.0 can.
name: Dependency SCA

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - development
  schedule:
    # Weekly hygiene scan (offset from Scorecard / CodeQL).
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-sca:
    if: github.repository == 'thaw-app/Thaw'
    name: dependency-sca
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate SCA suppressions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import sys
          import tomllib
          from pathlib import Path

          path = Path("osv-scanner.toml")
          if not path.is_file():
              print("::error::osv-scanner.toml is missing")
              sys.exit(1)

          data = tomllib.loads(path.read_text(encoding="utf-8"))
          ignored = data.get("IgnoredVulns") or []
          errors: list[str] = []

          for i, entry in enumerate(ignored, start=1):
              if not isinstance(entry, dict):
                  errors.append(f"IgnoredVulns[{i}] must be a table")
                  continue
              vuln_id = entry.get("id") or f"#{i}"
              reason = entry.get("reason")
              if not isinstance(reason, str) or not reason.strip():
                  errors.append(
                      f"IgnoredVulns id={vuln_id!r} requires a non-empty reason "
                      "(see .github/SECURITY.md § Dependency SCA policy)"
                  )
              ignore_until = entry.get("ignoreUntil")
              if ignore_until is None or (
                  isinstance(ignore_until, str) and not str(ignore_until).strip()
              ):
                  errors.append(
                      f"IgnoredVulns id={vuln_id!r} requires ignoreUntil "
                      "(YYYY-MM-DD expiry; see .github/SECURITY.md)"
                  )

          if errors:
              for msg in errors:
                  print(f"::error::{msg}")
              sys.exit(1)

          print(f"Validated {len(ignored)} IgnoredVulns suppression(s)")
          PY

      - name: Install OSV-Scanner
        env:
          # Pin by version *and* archive digest, the same pattern as Syft in
          # release.yml. Digests from osv-scanner_SHA256SUMS on the release.
          OSV_SCANNER_VERSION: "2.4.0"
          OSV_SCANNER_SHA256_LINUX_AMD64: "15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0"
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/osv-scanner-bin"
          mkdir -p "$bin"
          dest="$bin/osv-scanner"
          curl -sSfL --retry 3 \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64" \
            -o "$dest"
          echo "${OSV_SCANNER_SHA256_LINUX_AMD64}  ${dest}" | sha256sum -c -
          chmod +x "$dest"
          echo "$bin" >> "$GITHUB_PATH"
          "$dest" --version

      - name: Scan dependencies (OSV)
        id: scan
        env:
          LOCKFILE: Thaw.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
        run: |
          set -euo pipefail
          test -f "$LOCKFILE"

          # Always write reports, then exit with the scanner status so SARIF
          # upload can use if: always() while vulns still fail the job.
          set +e
          osv-scanner scan source \
            --lockfile="$LOCKFILE" \
            --config=osv-scanner.toml \
            --format=json \
            --output-file=results.json
          json_ec=$?
          osv-scanner scan source \
            --lockfile="$LOCKFILE" \
            --config=osv-scanner.toml \
            --format=sarif \
            --output-file=results.sarif
          sarif_ec=$?
          set -e

          if [[ ! -f results.json ]]; then
            echo "::error::OSV-Scanner did not produce results.json (exit=${json_ec})"
            exit 1
          fi

          # Prefer the JSON scan exit code (0 clean, 1 vulns, 128+ errors).
          if [[ "$json_ec" -ne 0 ]]; then
            exit "$json_ec"
          fi
          if [[ "$sarif_ec" -ne 0 && "$sarif_ec" -ne 1 ]]; then
            exit "$sarif_ec"
          fi
          exit 0

      - name: Upload SARIF
        if: >-
          ${{
            always()
            && !cancelled()
            && hashFiles('results.sarif') != ''
            && (github.event_name != 'pull_request'
                || github.event.pull_request.head.repo.full_name == github.repository)
          }}
        uses: github/codeql-action/upload-sarif@c54b30b7df092240050e69945842bc67aee0f0f4 # v4.37.3
        with:
          sarif_file: results.sarif
          category: dependency-sca

      - name: Upload JSON results
        if: ${{ always() && !cancelled() && hashFiles('results.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-scanner-results
          path: results.json
          retention-days: 14
