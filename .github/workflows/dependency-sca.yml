# OSV lockfile scan for OpenSSF OSPS-VM-05.03; fails on unsuppressed vulns. The
# CLI is pinned by version and SHA-256; the Action image can't read Package.resolved.
name: Dependency SCA

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - development
  schedule:
    # Weekly hygiene scan (offset from Scorecard / CodeQL).
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-sca:
    if: github.repository == 'thaw-app/Thaw'
    name: dependency-sca
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: thaw-app/org-ci/actions/dependency-sca@61f345397193bf3f9356c4f6179fb6ed4c84dd45
        with:
          lockfiles: |
            Thaw.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          config: osv-scanner.toml
