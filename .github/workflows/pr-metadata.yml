name: "PR Metadata"

# Labels (type/area) + shape checks (base/title/Closes/DCO; size warn-only).
# Uses pull_request_target so fork PRs can still receive labels.
# DCO is verified via the Pulls commits API only (no checkout of PR code).
# Crowdin sync PRs are skipped: they are translation-only and often huge.
# They are matched on head branch + same-repo + maintainer association, never on
# PR title, so an untrusted fork cannot title its way past the checks.
# Dependabot/Renovate PRs are skipped: they use bot PR bodies (no template) and
# are identified by verified bot login only, never by title.
#
# Spam guard: do not run on `edited` (title/body tweaks). Size heads-ups go to
# the job summary only, never PR comments, so pushes don't bump the timeline.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    if: github.repository == 'thaw-app/Thaw'
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      # Crowdin sync PRs are trusted translation dumps; skip labeling/shape checks.
      # Identified by head branch + same-repo + maintainer association, never by
      # PR title, which any untrusted fork author can set to bypass checks.
      - name: Detect Crowdin sync PR
        id: crowdin
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setOutput('is_crowdin_sync', 'false');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const isCrowdinSync =
              pr.head?.ref === 'l10n_development' &&
              pr.head?.repo?.full_name === `${owner}/${repo}` &&
              ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(pr.author_association || '');
            core.setOutput('is_crowdin_sync', isCrowdinSync ? 'true' : 'false');
            if (isCrowdinSync) {
              core.info('Skipping PR metadata for Crowdin sync PR.');
            }

      # Dependabot/Renovate use their own PR bodies (no Closes:/template checkboxes).
      # Match verified bot logins only, never titles, so forks cannot skip checks.
      - name: Detect bot dependency PR
        id: bot_deps
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const login = context.payload.pull_request?.user?.login || '';
            const isBotDeps = login === 'dependabot[bot]' || login === 'renovate[bot]';
            core.setOutput('is_bot_deps', isBotDeps ? 'true' : 'false');
            if (isBotDeps) {
              core.info(`Skipping PR metadata for bot dependency PR (${login}).`);
            }

      - name: Apply labels from PR template and changed paths
        if: steps.crowdin.outputs.is_crowdin_sync != 'true' && steps.bot_deps.outputs.is_bot_deps != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;

            const body = pr.body || '';
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // PR change kinds. Bug is an Issue type; bug fixes use `fix` on PRs.
            const typeLabels = {
              'Bug fix': ['fix'],
              'CI/CD': ['ci', 'cd'],
              'Documentation': ['docs'],
              'Feature': ['feature'],
              'Enhancement': ['enhancement'],
              'Refactor': ['refactor'],
              'Performance improvement': ['performance'],
              'Test addition or update': ['test'],
              'Other (please describe)': ['chore'],
            };

            const areaLabels = [
              'menubar',
              'icebar',
              'layout',
              'appearance',
              'settings',
              'onboarding',
              'permissions',
              'profiles',
              'hotkeys',
              'updates',
              'ops',
            ];

            // First matching rule wins per path; settings/ops are fallbacks when nothing else matched.
            const pathAreaRules = [
              { label: 'icebar', test: (p) => p.startsWith('Thaw/MenuBar/IceBar/') },
              { label: 'layout', test: (p) =>
                p.startsWith('Thaw/MenuBar/LayoutBar/') ||
                /MenuBarLayout/i.test(p) ||
                /SavedLayout/i.test(p)
              },
              { label: 'appearance', test: (p) =>
                p.startsWith('Thaw/MenuBar/Appearance/') ||
                /MenuBarAppearance/i.test(p)
              },
              { label: 'menubar', test: (p) => p.startsWith('Thaw/MenuBar/') },
              { label: 'onboarding', test: (p) => p.startsWith('Thaw/Onboarding/') },
              { label: 'permissions', test: (p) => p.startsWith('Thaw/Permissions/') },
              { label: 'profiles', test: (p) => /Profile/i.test(p) },
              { label: 'hotkeys', test: (p) => /Hotkey/i.test(p) },
              { label: 'updates', test: (p) =>
                /Sparkle/i.test(p) ||
                /\/Update/i.test(p) ||
                /appcast/i.test(p)
              },
              { label: 'settings', test: (p) => p.startsWith('Thaw/Settings/') },
              { label: 'ops', test: (p) =>
                p.startsWith('.github/') ||
                p.startsWith('scripts/') ||
                p === 'AGENTS.md' ||
                p === 'FREQUENT_ISSUES.md' ||
                p === 'README.md' ||
                p === '.swiftformat' ||
                p === '.swiftlint.yml' ||
                p === 'sonar-project.properties'
              },
            ];

            const getSection = (heading) => {
              const re = new RegExp(`##\\s*${heading}\\s*\\n([\\s\\S]*?)(?=\\n##\\s|$)`, 'i');
              const match = body.match(re);
              return match ? match[1] : '';
            };

            const isChecked = (section, text) => {
              const escaped = text.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const re = new RegExp(`-\\s*\\[[xX]\\]\\s*${escaped}`);
              return re.test(section);
            };

            const prTypeSection = getSection('PR Type');
            const areaSection = getSection('Area');
            const breakingSection = getSection('Does this PR introduce a breaking change\\?');

            const toAdd = new Set();
            const toRemove = new Set();

            for (const [text, labels] of Object.entries(typeLabels)) {
              if (isChecked(prTypeSection, text)) {
                for (const label of labels) toAdd.add(label);
              } else {
                for (const label of labels) toRemove.add(label);
              }
            }

            if (isChecked(breakingSection, 'Yes')) {
              toAdd.add('breaking-change');
            } else {
              toRemove.add('breaking-change');
            }

            // Retired on issues and invalid on PRs: never leave `bug` on a PR.
            toRemove.add('bug');

            // Path-based areas.
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const pathAreas = new Set();
            for (const file of files) {
              const path = file.filename;
              for (const rule of pathAreaRules) {
                if (rule.test(path)) {
                  pathAreas.add(rule.label);
                  break;
                }
              }
            }

            // Prefer specific product areas over the settings fallback when both matched.
            // Keep `ops` alongside `settings` when those are the only matched areas.
            const productAreasExcludingSettings = [
              'menubar',
              'icebar',
              'layout',
              'appearance',
              'onboarding',
              'permissions',
              'profiles',
              'hotkeys',
              'updates',
            ];
            if (
              pathAreas.has('settings') &&
              productAreasExcludingSettings.some((label) => pathAreas.has(label))
            ) {
              pathAreas.delete('settings');
            }

            for (const label of pathAreas) toAdd.add(label);

            // Manual Area checkboxes only add (do not remove path-applied areas).
            for (const label of areaLabels) {
              if (isChecked(areaSection, label)) {
                toAdd.add(label);
              }
            }

            // Do not remove a change-kind label we are also adding.
            for (const label of toAdd) toRemove.delete(label);

            const existing = (await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner,
              repo,
              issue_number: pr.number,
            })).map(l => l.name);

            const addList = [...toAdd].filter(l => !existing.includes(l));
            if (addList.length > 0) {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: addList,
              });
            }

            for (const label of toRemove) {
              if (existing.includes(label)) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number: pr.number,
                  name: label,
                });
              }
            }

      - name: Check PR conventions and post summary comment
        if: steps.crowdin.outputs.is_crowdin_sync != 'true' && steps.bot_deps.outputs.is_bot_deps != 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = pr.title || '';
            const body = pr.body || '';
            const base = pr.base?.ref || '';
            const association = pr.author_association || '';
            const author = pr.user?.login || '';
            const maintainerAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);

            const failures = [];
            const warnings = [];

            if (base === 'main' && !maintainerAssociations.has(association)) {
              failures.push(
                `Base branch is \`main\`. External PRs must target \`development\` (see CONTRIBUTING).`,
              );
            }

            const titleRe = /^(feat|fix|chore|docs|ci|test|refactor|perf|build|style|revert)(\(.+\))?!?: .+/;
            if (!titleRe.test(title)) {
              failures.push(
                `Title must match conventional commits, e.g. \`fix(menubar): …\` or \`feat(settings): …\`. Got: \`${title}\`.`,
              );
            }

            if (!/\bCloses:\s*(?:#\d+|N\/A)\b/i.test(body)) {
              failures.push(
                `PR body must include a \`Closes:\` line (e.g. \`Closes: #123\` or \`Closes: N/A\`).`,
              );
            }

            // DCO: every non-merge, non-bot commit needs Signed-off-by matching the author email.
            // Exemptions are an exact allowlist of verified bot identities; substring
            // matching on the login would let any account named `…crowdin…` skip DCO.
            // Crowdin sync PRs are skipped above. Keep crowdin[bot] for the GitHub
            // App identity if it ever commits outside that path; crowdin-bot is not
            // a verified commit login on this repository.
            const dcoBotLogins = new Set([
              'dependabot[bot]',
              'renovate[bot]',
              'github-actions[bot]',
              'crowdin[bot]',
            ]);

            // Sign-off must live in the trailing trailer block (as `git commit -s`
            // writes it), so a `Signed-off-by:` line quoted in the body does not count.
            const trailerBlock = (message) => {
              const lines = message.replace(/\s+$/, '').split('\n');
              let start = lines.length;
              for (let i = lines.length - 1; i >= 0; i--) {
                const line = lines[i];
                if (line.trim() === '') break;
                // A trailer is `Key: value`, or a folded continuation line.
                if (!/^[A-Za-z][A-Za-z0-9-]*:\s/.test(line) && !/^\s+\S/.test(line)) break;
                start = i;
              }
              return lines.slice(start);
            };

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const dcoMissing = [];
            for (const entry of commits) {
              if (dcoBotLogins.has(entry.author?.login || '')) {
                continue;
              }
              if ((entry.parents || []).length > 1) {
                continue; // merge commit
              }
              const authorEmail = (entry.commit?.author?.email || '').trim().toLowerCase();
              const message = entry.commit?.message || '';
              if (!authorEmail) {
                dcoMissing.push(entry.sha.slice(0, 8));
                continue;
              }
              const signoffEmails = [];
              for (const line of trailerBlock(message)) {
                const match = line.match(/^Signed-off-by:\s*.+<([^>]+)>\s*$/i);
                if (match) signoffEmails.push(match[1].trim().toLowerCase());
              }
              if (!signoffEmails.includes(authorEmail)) {
                dcoMissing.push(entry.sha.slice(0, 8));
              }
            }
            if (dcoMissing.length > 0) {
              failures.push(
                `DCO: commit(s) missing a \`Signed-off-by\` trailer matching the author email: \`${dcoMissing.join('`, `')}\`. Use \`git commit -s\` (or \`git rebase --signoff\` then force-push). See CONTRIBUTING.`,
              );
            }

            const changedFiles = pr.changed_files || 0;
            const churn = (pr.additions || 0) + (pr.deletions || 0);
            if (changedFiles > 30 || churn > 1000) {
              warnings.push(
                `This PR looks large (${changedFiles} files, ${churn} lines changed). Consider splitting if possible (see CONTRIBUTING: aim ≤20 files / ≤500 LOC).`,
              );
            }

            // Build the PR comment body.
            const marker = '<!-- thaw-pr-conventions -->';
            const lines = [marker];

            // Collect labels that were applied (set by the previous step via env).
            const currentLabels = (await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner,
              repo,
              issue_number: pr.number,
            })).map(l => l.name);

            if (currentLabels.length > 0) {
              lines.push(`**Labels:** ${currentLabels.map(l => '`' + l + '`').join(', ')}`);
            }

            if (failures.length > 0) {
              lines.push('');
              lines.push(`> [!CAUTION]`);
              lines.push(`> **Convention issues found**: please fix before merge.`);
              for (const f of failures) {
                lines.push(`> - ${f}`);
              }
            }

            if (warnings.length > 0) {
              lines.push('');
              lines.push(`> [!WARNING]`);
              for (const w of warnings) {
                lines.push(`> ${w}`);
              }
            }

            if (failures.length === 0 && warnings.length === 0) {
              lines.push('');
              lines.push('All convention checks passed. :white_check_mark:');
            }

            if (author) {
              lines.push('');
              lines.push(`cc @${author}`);
            }

            const commentBody = lines.join('\n');

            // Upsert: find existing bot comment with our marker, update or create.
            const existing = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100,
            });
            const botComment = existing.find(
              (c) => c.user?.type === 'Bot' && (c.body || '').includes(marker),
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: botComment.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: commentBody,
              });
            }

            // Also write to job summary for the Actions UI.
            if (warnings.length > 0) {
              core.summary
                .addHeading('PR size heads-up')
                .addList(warnings)
                .addRaw('_Informational only, does not block merge._')
                .write();
            }

            if (failures.length > 0) {
              core.setFailed(failures.join('\n'));
            } else {
              core.info('PR conventions checks passed.');
            }
