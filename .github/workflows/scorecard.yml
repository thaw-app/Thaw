# This workflow uses actions that are not certified by GitHub. They are provided
# by a third-party and are governed by separate terms of service, privacy
# policy, and support documentation.

name: Scorecard
on:
  # Only the default branch is supported for publishing results / badge.
  push:
    branches:
      - development
  schedule:
    # Weekly on Saturdays.
    - cron: "30 1 * * 6"
  workflow_dispatch:

# Declare default permissions as read only.
# Publishing requires no workflow-level write permissions. The analysis job
# declares its own full permission set, which replaces this default outright.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
      # Needed to publish results and enable a badge (this repo is public).
      id-token: write
      contents: read
      actions: read

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes results to the OpenSSF REST API and enables the README badge.
          publish_results: true
          # Fine-grained PAT secret with admin-level repository read access so
          # Branch-Protection can be evaluated when classic protection APIs are used.
          repo_token: ${{ secrets.SCORECARD_READ_TOKEN }}

      - name: "Upload artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: results.sarif
