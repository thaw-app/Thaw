# This workflow uses actions that are not certified by GitHub. They are provided
# by a third-party and are governed by separate terms of service, privacy
# policy, and support documentation.

name: Scorecard
on:
  # A scheduled run uses the default branch, the only one results and the
  # badge can be published from.
  schedule:
    # Weekly on Saturdays.
    - cron: "30 1 * * 6"
  workflow_dispatch:

# Read-only default; the analysis job declares its own full permission set.
permissions:
  contents: read

jobs:
  analysis:
    if: github.repository == 'thaw-app/Thaw'
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Needed to upload the results to code-scanning dashboard.
      security-events: write
      # Needed to publish results and enable a badge (this repo is public).
      id-token: write
      contents: read
      actions: read

    steps:
      - name: "Checkout code"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run analysis"
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes results to the OpenSSF REST API and enables the README badge.
          publish_results: true
          # Fine-grained PAT secret with admin-level repository read access so
          # Branch-Protection can be evaluated when classic protection APIs are used.
          repo_token: ${{ secrets.SCORECARD_READ_TOKEN }}

      - name: "Upload artifact"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: "Upload to code-scanning"
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
