name: Remove Skipped Workflow Runs
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove-skipped-runs:
    if: github.repository == 'thaw-app/Thaw'
    runs-on: ubuntu-slim
    permissions:
      actions: write
    steps:
      - uses: thaw-app/org-ci/actions/remove-skipped-runs@cfa52194f39013d6f54e6f5a14dc57cec3a20e9b
