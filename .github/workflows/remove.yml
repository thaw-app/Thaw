name: Remove Skipped Workflow Runs
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove-skipped-runs:
    if: github.repository == 'thaw-app/Thaw'
    runs-on: ubuntu-slim
    permissions:
      actions: write
    steps:
      - uses: thaw-app/org-ci/actions/remove-skipped-runs@61f345397193bf3f9356c4f6179fb6ed4c84dd45
