name: Remove Skipped Workflow Runs
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove-skipped-runs:
    if: github.repository == 'thaw-app/Thaw'
    runs-on: ubuntu-slim
    permissions:
      actions: write
    steps:
      - uses: thaw-app/org-ci/actions/remove-skipped-runs@214298d1d187792fa31e638bf27b146f0de5565e
