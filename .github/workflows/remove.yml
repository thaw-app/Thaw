name: Remove Skipped Workflow Runs
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remove-skipped-runs:
    if: github.repository == 'thaw-app/Thaw'
    runs-on: ubuntu-slim
    permissions:
      actions: write
    steps:
      - uses: thaw-app/org-ci/actions/remove-skipped-runs@a5d047fe853b328067a3423f40d404b4b8245653
