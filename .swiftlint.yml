included:
  - MenuBarModel
  - Shared
  - Thaw
  - ThawCapture
  - ThawCtl
  - ThawUI

excluded:
  - MenuBarModel/.build
  - ThawCapture/.build
  - ThawCtl/.build
  - ThawUI/.build
  - ThawTests
  - MenuBarModel/Package.swift
  - ThawCapture/Package.swift
  - ThawCtl/Package.swift
  - ThawUI/Package.swift

disabled_rules:
  - function_parameter_count
  - generic_type_name
  - identifier_name
  - inclusive_language
  - large_tuple
  - line_length
  - opening_brace
  - todo

# The file, function, type, complexity and nesting limits are on, but the
# violations that predate them are grandfathered in .swiftlint.baseline, so
# only new ones warn. That file holds these five rules only; every other rule
# still reports. Regenerate by enabling the five in a scratch config, running
# `swiftlint lint --write-baseline`, then keeping just these rule ids.
baseline: .swiftlint.baseline

opt_in_rules:
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - convenience_type
  - discouraged_object_literal
  - empty_count
  - fatal_error_message
  - file_header
  - force_unwrapping
  - implicitly_unwrapped_optional
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - multiline_arguments
  - multiline_arguments_brackets
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - period_spacing
  - unavailable_function
  - vertical_parameter_alignment_on_call
  - vertical_whitespace_closing_braces
  - yoda_condition

custom_rules:
  objc_dynamic:
    name: "@objc dynamic"
    message: "`dynamic` modifier should immediately follow `@objc` attribute"
    regex: '@objc\b(\(\w*\))?+\s*(\S+|\v+\S*)\s*\bdynamic'
    match_kinds: attribute.builtin
  prefer_spaces_over_tabs:
    name: Prefer Spaces Over Tabs
    message: "Indentation should use 4 spaces per indentation level instead of tabs"
    regex: ^\t
  store_write_needs_permit:
    name: Store Write Needs A Permit
    message: "Write the position table through MenuBarPositionStoreProvider.current with a StoreWritePermit; see RepairOrchestrator"
    regex: 'RuntimePositionStore\.(repairTrailingSiri|writeClusterBoundaryCrossing|applyOrder|respaceOrder)\(|MenuBarPositionStoreProvider\.forEngine'
    excluded:
      - Thaw/MenuBar/Backends
      - Thaw/Items/Persistence/PositionStoreRecoveryEnvironment.swift
    severity: error

# The Ice attribution line is optional: files whose last remaining
# Baird-authored lines have been replaced drop it, and files that still carry
# some keep it. Both shapes have to lint clean while the changeover is partial.
file_header:
  required_pattern: |-
    //
    //  SWIFTLINT_CURRENT_FILENAME
    //  Project: Thaw
    //
    //  Copyright \(Thaw\) © 2026 Toni Förster
    //  Licensed under the GNU GPLv3

modifier_order:
  preferred_modifier_order:
    - acl
    - setterACL
    - override
    - mutators
    - lazy
    - final
    - required
    - convenience
    - typeMethods
    - owned

trailing_comma:
  mandatory_comma: true
